; DY-EP4 project-local PlatformIO configuration.
; All downloaded platforms, packages, caches and build output stay in this
; project so another PlatformIO project cannot change this environment.

[platformio]
workspace_dir = .pio
packages_dir = .platformio/packages
platforms_dir = .platformio/platforms
cache_dir = .platformio/cache
default_envs = dy_ep4
src_dir = main

[env:dy_ep4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4-evboard
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_build.flash_mode = qio
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3

; Keep the project's checked-in ESP-IDF configuration as the source of truth.
board_build.sdkconfig = sdkconfig
